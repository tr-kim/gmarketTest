<!DOCTYPE html>
<html lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 		
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/fonts.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/common.js}"></script>
	<title>지마켓 모니터링 상세</title>
	
	<!-- DevExtreme theme -->
	<link rel="stylesheet" th:href="@{/css/devextreme/dx.fluent.blue.light.css}" />
	
	<!-- DevExtreme library -->
	<script th:src="@{/js/devextreme/jquery.min.js}"></script>
	<script th:src="@{/js/devextreme/dx.all.js}"></script>
	<script th:src="@{/js/devextreme/exceljs.min.js}"></script>
	<script th:src="@{/js/devextreme/FileSaver.min.js}"></script>
	<script th:src="@{/js/devextreme/localization/dx.messages.ko.js}"></script>
	
	<!-- DevExtreme License Key -->
	<script th:src="@{/js/devextreme/devextreme-license.js}"></script>
</head>
<body>
	<div class="detail-container">
		<!-- 왼쪽: dxList -->
		<div class="detail-left">
			<div class="list-header">서비스 목록</div>
			<div id="listPanel"></div>
		</div>
		
		<!-- 오른쪽: dxChart -->
		<div class="detail-right">
			<div id="chartToolbar" style="height:40px; display:flex; gap:8px; align-items:center;">
				<span>지마켓 서비스별 모니터링</span>
			</div>
			<div id="chartPanel"></div>
		</div>
	</div>
<script>
	<!-- 한국어 적용(ko-KR) -->
	DevExpress.localization.locale(navigator.language);
	
	$(function() {
		// 서비스명
		const tasks = [
			{ id: 1, name: 'KT-SME-ENG' },
			{ id: 2, name: 'KT-SMS-ETC' },
			{ id: 3, name: 'KT-SMS-EVENT-GMA' },
			{ id: 4, name: 'KT-GMKT-LMS-LARGE' },
			{ id: 5, name: 'KT-GMKT-MMS-LARGE' },
			{ id: 6, name: 'KT-GMKT-SMS-LARGE' },
			{ id: 7, name: 'KT-SMS-LARGE-GMA' },
			{ id: 8, name: 'KT-LMS-EVENT-GMA' },
			{ id: 9, name: 'KT-LMS-LARGE-GMA' },
			{ id: 10, name: 'KT-MEMMON' },
			{ id: 11, name: 'KT-MMS-EVENT-GMA' },
			{ id: 12, name: 'KT-MMS-LARGE-GMA' },
			{ id: 13, name: 'KT-SMS-ORDER' },
			{ id: 14, name: 'KT-SMS-EPLE' },
			{ id: 15, name: 'KT-SMS-STATP-GMA' },
			{ id: 16, name: 'KT-SMS-STATP-GMA-2CON' },
			{ id: 17, name: 'KT-SMS-TRAN' },
			{ id: 18, name: 'KT-SMS-TSP' },
			{ id: 19, name: 'KT-SMS-MO4MMS' },
			{ id: 20, name: 'KT-SFC-SMS' },
			{ id: 21, name: 'KT-SFC-MMS' },
			{ id: 22, name: 'KT-SFC-LMS' },
			{ id: 23, name: 'KT-MMS-NON-GMA' },
			{ id: 24, name: 'KT-LMS-NON-GMA' },
			{ id: 25, name: 'KT-G9-SMS-LARGE' },
			{ id: 26, name: 'KT-G9-MMS-LARGE' },
			{ id: 27, name: 'KT-G9-LMS-LARGE' }
		];
	    
		// dxList 초기화
		const listWidget = $('#listPanel').dxList({
			dataSource: new DevExpress.data.DataSource({
				store: new DevExpress.data.ArrayStore({
					key: 'id',
					data: tasks,
				}),
			}),
			displayExpr: "name",
			showSelectionControls: true,
			selectByClick: true,
			selectionMode: 'all',
		    pageLoadMode: 'scrolling', // more 버튼 비활성화
		    scrollingEnabled: true,
			onSelectionChanged(e) {
				const selectedKeys = listWidget.option('selectedItemKeys').join(', ');
				console.log(selectedKeys);
				
				// 더미 데이터 생성 & 차트 갱신
				const selectedItems = listWidget.option('selectedItems'); // 배열
				updateChart(selectedItems);
			},
		}).dxList('instance');
		
		// dxChart 초기화
		const chartWidget = $("#chartPanel").dxChart({
			dataSource: [],
			commonSeriesSettings: {
				argumentField: "date",
				type: "line"
			},
			series: [{
				valueField: "value",
				name: "건수"
			}],
			legend: {
				visible: true
			},
			argumentAxis: {
				argumentType: "datetime"
			},
			tooltip: {
				enabled: true
			}
		}).dxChart("instance");
		
		// 더미 데이터 생성 & 차트 갱신
		function updateChart(items) {
			 // 선택된 항목마다 차트 series 구성
			const chartSeries = items.map(item => ({
				valueField: item.name, // 이 필드를 라인으로 그림
				name: item.name // 범례에 표시될 이름
			}));
			
			// 차트용 데이터 생성
			const now = new Date();
			const data = [];
			for (let i = 0; i < 10; i++) { // 최근 10일치
				const point = {
					date: new Date(now.getFullYear(), now.getMonth(), now.getDate() - (10 - i)) // x축 값: 날짜
				};
				
				// 선택된 각 서비스에 대해 y값 생성
				// 각 서비스의 값: 10~109 범위의 랜덤 수
				items.forEach(item => {
					point[item.name] = Math.floor(Math.random() * 100) + 10; // point 객체의 key 이름은 반드시 series.valueField와 일치해야 함
				});
				data.push(point);
			}
			
			chartWidget.option({
				//title: `트래픽`,
				dataSource: data,
				series: chartSeries
			});
		}
	});
</script>
</body>
</html>
