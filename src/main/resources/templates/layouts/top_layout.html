<!DOCTYPE html>
<html lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 		
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/fonts.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>Gmarket</title>
	
	<!-- DevExtreme theme -->
	<link rel="stylesheet" th:href="@{/css/devextreme/dx.fluent.blue.light.css}" />
	
	<!-- DevExtreme library -->
	<script th:src="@{/js/devextreme/jquery.min.js}"></script>
	<script th:src="@{/js/devextreme/dx.all.js}"></script>
	<script th:src="@{/js/devextreme/exceljs.min.js}"></script>
	<script th:src="@{/js/devextreme/FileSaver.min.js}"></script>
	<script th:src="@{/js/devextreme/localization/dx.messages.ko.js}"></script>
	
	<!-- DevExtreme License Key -->
	<script th:src="@{/js/devextreme/devextreme-license.js}"></script>
	
	<!-- RSA -->
	<script th:src="@{/js/rsa/jsbn.js}"></script>
	<script th:src="@{/js/rsa/rsa.js}"></script>
	<script th:src="@{/js/rsa/prng4.js}"></script>
	<script th:src="@{/js/rsa/rng.js}"></script>
	<script th:src="@{/js/rsa/jsrsasign-all-min.js}"></script>
	
	<script th:src="@{/js/common.js}"></script>
</head>
<body class="bg">
	<header>
        <div class="container d-flex justify-content-between align-items-center position-relative">
            <div class="logo">
                <a th:href="@{/}">
                    <img th:src="@{/images/logo.png}" alt="지마켓로고">
                </a>
            </div>
            <a href="javascript:void(0);" class="user_profile d-flex align-items-center">
                <div class="user_img">
                    <img th:src="@{/images/user.png}" alt="사용자 이미지">
                </div>
                <div class="ms-2 text-center">
                    <div class="user_nm font-weight-500">
						<span sec:authentication="principal.username"></span>
                    </div>
                    <div class="user_grade">
						<span sec:authentication="principal.userGradeName"></span>
                    </div>
                </div>
            </a>
            <button class="psw_chg_btn">
                비밀번호 변경
            </button>
        </div>
    </header>
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <ul class="gnb d-flex justify-content-between align-items-center">
                <li th:classappend="${active == 'hist' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
					<a th:href="@{/view/hist}"><i class="bi bi-list-ul me-2"></i>이력 조회</a>
				</li>
                <li th:classappend="${active == 'send' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
					<a th:href="@{/view/singleSend}"><i class="bi bi-send me-2"></i>개별 발송</a>
				</li>
                <li class="sendmenu" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
                    <a href="javascript:void(0);">
						<i class="bi bi-envelope me-2"></i>대량 발송
						<i class="bi bi-chevron-down font-sz-12"></i>
					</a>
                    <ul class="flex-column align-items-center">                        
                        <li sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
							<a th:href="@{/view/excelSend}">엑셀 발송</a>
						</li>
                        <li sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
							<a th:href="@{/view/fileSend}">파일 발송</a>
						</li>
                        <li sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
							<a th:href="@{/view/dbSend}">DB 발송</a>
						</li>
                        <li sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
							<a th:href="@{/view/bulkHist}">대량 발송 이력</a>
						</li>
                    </ul>
                </li>
                <li th:classappend="${active == 'wait' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_USER')">
					<a th:href="@{/view/wait}">
						<i class="bi bi-hourglass me-2"></i>대기 메시지 조회
					</a>
				</li>
                <li th:classappend="${active == 'real' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_OPERATOR')">
					<a th:href="@{/view/real}">
						<i class="bi bi-graph-up me-2"></i>실시간 발송 현황
					</a>
				</li>
                <li th:classappend="${active == 'stat' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN')">
					<a th:href="@{/view/stat}">
						<i class="bi bi-search me-2"></i>정산/통계 조회
					</a>
				</li>
				<li th:classappend="${active == 'alarm' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN', 'ROLE_OPERATOR')">
					<a th:href="@{/view/alarm}">
						<i class="bi bi-exclamation-circle me-2"></i>알림 이력 조회
					</a>
				</li>
                <li th:classappend="${active == 'user' ? 'active' : ''}" sec:authorize="hasAnyRole('ROLE_SUPER', 'ROLE_ADMIN')">
					<a th:href="@{/view/user}">
						<i class="bi bi-people me-2"></i>사용자 관리
					</a>
				</li>
            </ul>
            <a th:href="@{/logout}" class="logout"><i class="bi bi-box-arrow-right me-2"></i>로그아웃</a>
        </div>
    </header>
    <section>
        <div class="container pb-3">
            <th:block layout:fragment="content"></th:block>
        </div>
    </section>
    <th:block th:replace="~{/view/popup/passwordChg :: passwordChg}"></th:block>
	<th:block th:replace="~{/view/popup/progressBar :: progressBar}"></th:block>
	<script th:inline="javascript">
		// 수신거부 번호
		const GMARKET_REJECT_NUM = /*[[${GMARKET_REJECT_NUM}]]*/ "";
		const AUCTION_REJECT_NUM = /*[[${AUCTION_REJECT_NUM}]]*/ "";
		
		// 사용자 등급 및 회사 코드
		const userGrade = /*[[${#authentication.principal.userGrade}]]*/ -1;
		const companyCode = /*[[${#authentication.principal.companyCode}]]*/ -1;
	</script>
	<script>
		<!-- 한국어 적용(ko-KR) -->
		DevExpress.localization.locale(navigator.language);
	</script>
</body>
</html>
