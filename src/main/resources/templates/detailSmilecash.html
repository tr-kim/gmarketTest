<!DOCTYPE html>
<html lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 		
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/fonts.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/common.js}"></script>
	<title>스마일캐시 모니터링 상세</title>
	
	<!-- DevExtreme theme -->
	<link rel="stylesheet" th:href="@{/css/devextreme/dx.fluent.blue.light.css}" />
	
	<!-- DevExtreme library -->
	<script th:src="@{/js/devextreme/jquery.min.js}"></script>
	<script th:src="@{/js/devextreme/dx.all.js}"></script>
	<script th:src="@{/js/devextreme/exceljs.min.js}"></script>
	<script th:src="@{/js/devextreme/FileSaver.min.js}"></script>
	<script th:src="@{/js/devextreme/localization/dx.messages.ko.js}"></script>
	
	<!-- DevExtreme License Key -->
	<script th:src="@{/js/devextreme/devextreme-license.js}"></script>
	
	<style>
		.detail-container {
			width: 1100px;
			height: 800px;
			margin: 16px auto;
			box-sizing: border-box;
			padding: 12px;
			background: #ffffff;
			border: 1px solid #e6e6e6;
			border-radius: 6px;
			display: flex;
			gap: 12px;
		}
		.detail-left {
			width: 280px;
			min-width: 220px;
			height: 100%;
			box-shadow: 0 0 0 1px rgba(0,0,0,0.05) inset;
			overflow-y: auto;
			padding: 8px;
			background: #fafafa;
			border-radius: 4px;
		}
		.detail-right {
			flex: 1 1 auto;
			height: 100%;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		#chartPanel {
			flex: 1 1 auto;
			min-height: 200px;
			background: #ffffff;
			border: 1px solid #f0f0f0;
			border-radius: 4px;
		}
		.list-header {
			font-weight: 600;
			margin-bottom: 8px;
		}
	</style>
</head>
<body>
<div class="detail-container">
	<!-- 왼쪽: dxList -->
	<div class="detail-left">
		<div class="list-header">서비스 목록</div>
		<div id="listPanel"></div>
	</div>
	
	<!-- 오른쪽: dxChart -->
	<div class="detail-right">
		<div id="chartToolbar" style="height:40px; display:flex; gap:8px; align-items:center;">
			<span>스마일캐시 서비스별 모니터링</span>
		</div>
		<div id="chartPanel"></div>
	</div>
</div>

<script>
	<!-- 한국어 적용(ko-KR) -->
	DevExpress.localization.locale(navigator.language);
	
	$(function() {
		// 서비스명
		const tasks = [
			{ id: 1, name: 'KT-SMS-ADMIN' },
			{ id: 2, name: 'KT-SMS-ALERT' },
			{ id: 3, name: 'KT-SMS-CERT' },
			{ id: 4, name: 'KT_SMS_INFO' }
		];
	    
		// dxList 초기화
		const listWidget = $('#listPanel').dxList({
			dataSource: new DevExpress.data.DataSource({
				store: new DevExpress.data.ArrayStore({
					key: 'id',
					data: tasks,
				}),
			}),
			displayExpr: "name",
			showSelectionControls: true,
			selectByClick: true,
			selectionMode: 'all',
		    pageLoadMode: 'scrolling', // more 버튼 비활성화
		    scrollingEnabled: true,
			onSelectionChanged(e) {
				const selectedKeys = listWidget.option('selectedItemKeys').join(', ');
				console.log(selectedKeys);
				
				// 더미 데이터 생성 & 차트 갱신
				const selectedItems = listWidget.option('selectedItems'); // 배열
				updateChart(selectedItems);
			},
		}).dxList('instance');
		
		// dxChart 초기화
		const chartWidget = $("#chartPanel").dxChart({
			dataSource: [],
			commonSeriesSettings: {
				argumentField: "date",
				type: "line"
			},
			series: [{
				valueField: "value",
				name: "건수"
			}],
			legend: {
				visible: true
			},
			argumentAxis: {
				argumentType: "datetime"
			},
			tooltip: {
				enabled: true
			}
		}).dxChart("instance");
		
		// 더미 데이터 생성 & 차트 갱신
		function updateChart(items) {
			 // 선택된 항목마다 차트 series 구성
			const chartSeries = items.map(item => ({
				valueField: item.name, // 이 필드를 라인으로 그림
				name: item.name // 범례에 표시될 이름
			}));
			
			// 차트용 데이터 생성
			const now = new Date();
			const data = [];
			for (let i = 0; i < 10; i++) { // 최근 10일치
				const point = {
					date: new Date(now.getFullYear(), now.getMonth(), now.getDate() - (10 - i)) // x축 값: 날짜
				};
				
				// 선택된 각 서비스에 대해 y값 생성
				// 각 서비스의 값: 10~109 범위의 랜덤 수
				items.forEach(item => {
					point[item.name] = Math.floor(Math.random() * 100) + 10; // point 객체의 key 이름은 반드시 series.valueField와 일치해야 함
				});
				data.push(point);
			}
			
			chartWidget.option({
				//title: `트래픽`,
				dataSource: data,
				series: chartSeries
			});
		}
	});
</script>
</body>
</html>
