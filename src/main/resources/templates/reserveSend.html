<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="reserveSend">
    <div class="modal-bg reserveSend">
        <div class="modal-wrap">
            <div class="modal-hd">
                <span class="font-sz-16 font-weight-600">예약 전송</span><button class="close_btn"><i class="bi bi-x-lg"></i><span class="visually-hidden">닫기</span></button>
            </div>
            <div class="modal-con">
                <div id="calendar"></div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <div class="date font-weight-600">날짜를 선택해 주세요.</div>
                    <div class="col-6 d-flex">
                        <select name="hour" id="hour" class="form-select me-1">
                            <option value="00">00시</option>
                            <option value="01">01시</option>
                            <option value="02">02시</option>
                            <option value="03">03시</option>
                            <option value="04">04시</option>
                            <option value="05">05시</option>
                            <option value="06">06시</option>
                            <option value="07">07시</option>
                            <option value="08">08시</option>
                            <option value="09">09시</option>
                            <option value="10">10시</option>
                            <option value="11">11시</option>
                            <option value="12">12시</option>
                            <option value="13">13시</option>
                            <option value="14">14시</option>
                            <option value="15">15시</option>
                            <option value="16">16시</option>
                            <option value="17">17시</option>
                            <option value="18">18시</option>
                            <option value="19">19시</option>
                            <option value="20">20시</option>
                            <option value="21">21시</option>
                            <option value="22">22시</option>
                            <option value="23">23시</option>                            
                        </select>
                        <select name="minute" id="minute" class="form-select ms-1">
                            <option value="00">00분</option>
                            <option value="05">05분</option>
                            <option value="10">10분</option>
                            <option value="15">15분</option>
                            <option value="20">20분</option>
                            <option value="25">25분</option>
                            <option value="30">30분</option>
                            <option value="35">35분</option>
                            <option value="40">40분</option>
                            <option value="45">45분</option>
                            <option value="50">50분</option>
                            <option value="55">55분</option>                            
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-ft">
                <button type="button" class="sub-bg">예약</button>
            </div>
        </div>
    </div>
</th:block>
</html>
