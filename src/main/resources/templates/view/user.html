<!DOCTYPE html>
<html lagn="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{${layout}}" layout:fragment="content">

<body>
<p class="font-sz-20 font-weight-600 pt-3 text-666">사용자 관리</p>
	<form class="content row mx-0 mb-2" id="user">
		<div class="col-6">
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
			 		<label class="font-weight-500">사용자 등급</label>
				</div>
				<div class="col">
					<select name="" id="" class="form-select">
						<option value="">슈퍼관리자</option>
						<option value="">관리자</option>
						<option value="">사용자</option>
						<option value="">운영자</option>
					</select>
				</div>
			</div>		
			
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">사용자 ID</label>
				</div>
				<div class="col">
					<input type="text" name="" id="" class="form-control" placeholder="아이디를 입력하세요.">
				</div>
			</div>			
		</div>
		<div class="col-6">
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
			 		<label class="font-weight-500">구분</label>
				</div>
				<div class="col">
					<select name="" id="" class="form-select">
						<option value="">G마켓</option>
					</select>
				</div>
			</div>			
			<div class="row d-flex align-items-center">
				<div class="col d-flex justify-content-end">
					<button class="btn btn-outline-primary font-sz-14 ms-2" id="add-btn">등록</button>
					<button class="btn btn-primary font-sz-14 ms-2">조회</button>
				</div>
			</div>
		</div>
	</form>
	<div class="content">
		<div id="userGrid"></div>
	</div>
	<th:block th:replace="~{/addUser :: addUser}"></th:block>
	<script th:src="@{/js/view/user.js}"></script>
</body>

</html>
