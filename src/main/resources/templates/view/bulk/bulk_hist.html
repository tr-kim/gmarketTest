<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{${layout}}" layout:fragment="content">

	<p class="font-sz-20 font-weight-600 pt-3 text-666">대량 발송 이력</p>
	<form class="content row mx-0 mb-2" id="bulk_hist">
		<div class="col-6">
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">발송 기간</label>
				</div>
				<div class="col d-flex align-items-center">
					<div id="startDate"></div>
						<span class="mx-2">~</span>
					<div id="endDate"></div>
				</div>
			</div>
			<div class="row d-flex align-items-center">
				<div class="col-3">
					<label class="font-weight-500">제목</label>
				</div>
				<div class="col">
					<div id="bulk-title"></div>
				</div>
			</div>
		</div>
		<div class="col-6">
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">대분류</label>
				</div>
				<div class="col">
					<div id="companyCode"></div>
				</div>
			</div>
			<div class="row d-flex align-items-center">
				<div class="col d-flex justify-content-end">
					<div id="excel-btn" class="me-2"></div>
					<div id="search-btn"></div>
				</div>
			</div>
		</div>
	</form>
	<div class="content">
		<div id="bulkHistGrid"></div>
	</div>
	<th:block th:replace="~{/view/popup/bulkHistDetail :: bulkHistDetail}"></th:block>
	<script th:src="@{/js/view/bulk_hist.js}"></script>
</html>
