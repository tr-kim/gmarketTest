<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{${layout}}" layout:fragment="content">

	<p class="font-sz-20 font-weight-600 pt-3 text-666">정산/통계 조회</p>
	<form class="content row mx-0 mb-2" id="statHistForm">
		<div class="col-7">
			<div class="row d-flex align-items-center mb-2 height-38">
				<div class="col-2">
					<label class="font-weight-500">구분</label>
				</div>
				<div class="col row">
					<div class="col"><label><input type="radio" name="timeType" value="1"> 시간</label></div>
					<div class="col"><label><input type="radio" name="timeType" value="2" checked> 일</label></div>
					<div class="col"><label><input type="radio" name="timeType" value="3"> 월</label></div>
					<div class="col"><label><input type="radio" name="timeType" value="4"> 년</label></div>
					<div class="col"></div>
				</div>
			</div>
			<div class="row d-flex align-items-center mb-2">
				<div class="col-2">
					<label class="font-weight-500">조회기간</label>
				</div>
				<div class="col d-flex align-items-center">
					<div id="startDate"></div>
					<div id="startHour" class="ms-2"></div>
					<span class="mx-1">~</span>
					<div id="endDate" class="me-2"></div>
					<div id="endHour"></div>
				</div>
			</div>
			                                 
		</div>
		<div class="col-5">
			<!-- <div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">시간</label>
				</div>
				<div class="col d-flex align-items-center">
					<div id="startTime" class="me-2"></div>
					<span class="mx-1">~</span>
					<div id="endTime" class="ms-2"></div>
				</div>
			</div> -->
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">대분류</label>
				</div>
				<div class="col">
					<div id="companyCategory"></div>
				</div>
			</div>
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">중분류</label>
				</div>
				<div class="col">
					<div id="tableCategory"></div>	
				</div>
			</div>
			<div class="row d-flex align-items-center">
				<div class="col d-flex justify-content-end">
					<div id="excel-btn" class="me-2"></div>
					<div id="search-btn"></div>
				</div>
			</div>
		</div>
	</form>
	<div class="content">
		<div id="statGrid"></div>
	</div>
	
	<script th:inline="javascript">
		const codeList = /*[[${list}]]*/ [];
	</script>
	<script th:src="@{/js/view/stat.js}"></script>
</html>
