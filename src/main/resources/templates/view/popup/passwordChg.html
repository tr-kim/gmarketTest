<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="passwordChg">
    <div class="modal-bg passwordChg">
        <div class="modal-wrap">
            <div class="modal-hd">
                <span class="font-sz-16 font-weight-600">비밀번호 변경</span><button class="close_btn"><i class="bi bi-x-lg"></i><span class="visually-hidden">닫기</span></button>
            </div>
            <div class="modal-con">
                <div class="mb-3 row">
                    <div class="col-6">
                        <label class="d-block mb-2">새 비밀번호</label>
                        <input type="password" class="form-control" name="new-psw" id="new-psw" placeholder="새 비밀번호를 입력하세요.">
                    </div>
                    <div class="col-6">
                        <label class="d-block mb-2">새 비밀번호 확인</label>
                        <input type="password" class="form-control" name="new-psw2" id="new-psw2"  placeholder="비밀번호를 확인하세요.">
                    </div>
                    <div class="d-flex align-items-center justify-content-end">
                        <span id="psw-ck"> </span>
                    </div>   
                </div>
                <span class="text-red">* 대소문자, 숫자, 특수문자( !@#$%^&*() )를 포함해 주세요.</span>
            </div>
            <div class="modal-ft">
                <button type="button" class="sub-bg">저장</button>
            </div>
        </div>
    </div>
</th:block>
</html>
