<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="imgPreview">

        <div class="modal-wrap">
            <div class="modal-hd">
                <span class="font-sz-16 font-weight-600">이미지 미리보기</span>
                <button class="close_btn" onclick="closeModal('imgPreview')"><i class="bi bi-x-lg"></i><span class="visually-hidden">닫기</span></button>
            </div>
            <div class="modal-con">
                <div id="dropzone-external" class="flex-box">

                </div>
            </div>
            <!-- <div class="modal-ft">
                <button type="button" class="sub-bg close_btn">닫기</button>
            </div> -->
        </div>
    </div>
