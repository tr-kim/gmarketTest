<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{${layout}}" layout:fragment="content">
	
	<p class="font-sz-20 font-weight-600 pt-3 text-666">이력 조회</p>
	<form class="content row mx-0 mb-2" id="hist">
		<div class="col-6">
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">조회 기간</label>
				</div>
				<div class="col d-flex align-items-center">
					<div id="startDate" class="me-2"></div>
					<span class="mx-1">~</span>
					<div id="endDate" class="ms-2"></div>
				</div>
			</div>
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">대분류</label>
				</div>
				<div class="col">
					<div id="companyCode"></div>
				</div>
			</div>
		</div>
		<div class="col-6">
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">수신 번호</label>
				</div>
				<div class="col">
					<div id="phone-num"></div>
				</div>
			</div>
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3">
					<label class="font-weight-500">중분류</label>
				</div>
				<div class="col">
					<div id="tableCode"></div>					
				</div>
			</div>
			<div class="row d-flex align-items-center mb-2">
				<div class="col-3"></div>
				<div class="col">
					※전체조회는 조회 기간의 시작달만을 조회
				</div>
			</div>
			<div class="row d-flex align-items-center">
				<div class="col d-flex justify-content-end">
					<div id="excel-btn" class="me-2"></div>
					<div id="search-btn"></div>
				</div>
			</div>
		</div>
	</form>
	<div class="content">
		<div id="histGrid"></div>
	</div>
	
	<script th:inline="javascript">
		const codeList = /*[[${list}]]*/ [];
	</script>
	<script th:src="@{/js/view/hist.js}"></script>
</html>
